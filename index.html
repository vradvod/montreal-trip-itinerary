<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montreal Trip · Oct 15–20</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div>
    <p class="eyebrow">Oct 15 – Oct 20</p>
    <h1>Montréal Trip Itinerary</h1>
    <p class="sub">Hotel Saint Laurent · 9 travelers</p>
  </div>
  <div class="tools">
    <button id="exportBtn" class="btn ghost">Export</button>
    <label class="btn ghost">Import<input id="importInput" type="file" accept="application/json" hidden></label>
    <button id="printBtn" class="btn ghost">Print</button>
    <button id="resetBtn" class="btn ghost">Reset</button>
  </div>
</header>
<nav id="tabs" class="tabs" role="tablist" aria-label="Trip days"></nav>
<section class="filter" aria-label="Traveler filter">
  <span>Show:</span>
  <div id="filter" class="chips"></div>
</section>
<main id="view"></main>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>
<script src="app.js"></script>
</body>
</html>
